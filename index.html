<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>News Subscription</title>

<style>

body{
    background:#000;
    color:#ff9900;
    font-family:sans-serif;
    padding:20px;
}

#status{
    color:white;
    font-size:28px;
    margin-bottom:20px;
}

#news{
    line-height:1.8;
    white-space:pre-wrap;
}

</style>

</head>
<body>

<div id="status">
読み込み中...
</div>

<div id="news">
</div>

<script>

const URL =
"https://news-subscription-worker.princess8mononoke.workers.dev?category=main";

async function loadNews(){

    try{

        const response =
            await fetch(URL);

        const xmlText =
            await response.text();

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                xmlText,
                "text/xml"
            );

        const items =
            xml.querySelectorAll("item");

        let output = "";

        items.forEach((item,index)=>{

            const title =
                item.querySelector("title")
                ?.textContent ?? "";

            const pubDate =
                item.querySelector("pubDate")
                ?.textContent ?? "";

            output +=
                (index + 1)
                + ". "
                + title
                + "\n"
                + pubDate
                + "\n\n";

        });

        document.getElementById(
            "status"
        ).textContent =
            "タイトル取得成功";

        document.getElementById(
            "news"
        ).textContent =
            output;

    }
    catch(error){

        document.getElementById(
            "status"
        ).textContent =
            "ERROR";

        document.getElementById(
            "news"
        ).textContent =
            error.toString();

    }

}

loadNews();

</script>

</body>
</html>
