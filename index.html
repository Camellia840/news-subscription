<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>News Subscription Debug</title>

<style>

body{

    background:#000;
    color:#ff9900;

    font-family:sans-serif;

    padding:20px;
}

#status{

    font-size:32px;
    color:white;

    margin-bottom:20px;
}

#result{

    font-size:20px;

    white-space:pre-wrap;
}

</style>

</head>

<body>

<div id="status">
起動中...
</div>

<div id="result">
</div>

<script>

const WORKER_URL =
"https://news-subscription-worker.princess8mononoke.workers.dev";

async function test(){

    try{

        document.getElementById(
          "status"
        ).textContent =
          "Worker接続中...";

        const response =
          await fetch(
            WORKER_URL +
            "?category=main&t=" +
            Date.now()
          );

        document.getElementById(
          "status"
        ).textContent =
          "HTTP " +
          response.status;

        const data =
          await response.json();

        document.getElementById(
          "status"
        ).textContent =
          "成功";

        document.getElementById(
          "result"
        ).textContent =
          JSON.stringify(
            data,
            null,
            2
          );

    }
    catch(e){

        document.getElementById(
          "status"
        ).textContent =
          "ERROR";

        document.getElementById(
          "result"
        ).textContent =
          e.toString();

    }

}

test();

</script>

</body>
</html>
