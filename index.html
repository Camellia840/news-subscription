<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Subscription</title>

<style>
body{
    background:#000;
    color:#ff9900;
    font-family:sans-serif;
    padding:20px;
}

#status{
    color:white;
    font-size:28px;
    margin-bottom:20px;
}

#news{
    white-space:pre-wrap;
    line-height:1.8;
}
</style>
</head>

<body>

<div id="status">
読み込み中...
</div>

<div id="news"></div>

<script>

const URL =
"https://news-subscription-worker.princess8mononoke.workers.dev?category=main";

async function loadNews(){

    try{

        const response =
            await fetch(URL);

        const xml =
            await response.text();

        document.getElementById("status")
            .textContent = "取得成功";

        document.getElementById("news")
            .textContent =
            xml.substring(0,3000);

    }
    catch(e){

        document.getElementById("status")
            .textContent = "ERROR";

        document.getElementById("news")
            .textContent = e.toString();

    }

}

loadNews();

</script>

</body>
</html>
